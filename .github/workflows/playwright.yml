name: Playwright E2E · bon-bonite.com

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # permite ejecutarlo a mano desde la pestaña Actions

# Una sola ejecución a la vez: los tests corren contra el sitio de producción.
concurrency:
  group: e2e-bonbonite
  cancel-in-progress: true

jobs:
  e2e:
    name: Escenarios E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar el navegador Chromium
        run: npx playwright install --with-deps chromium

      - name: Verificar tipos de TypeScript
        run: npm run typecheck

      - name: Ejecutar los 3 escenarios
        run: npx playwright test

      - name: Publicar reporte HTML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Publicar evidencias (capturas con recuadro rojo y videos)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: evidencias
          path: evidencias/
          retention-days: 14
